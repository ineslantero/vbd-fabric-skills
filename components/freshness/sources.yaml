# Microsoft Fabric documentation sources used by the freshness verifier.
# Add a new source by dropping a resolver under resolvers/ and appending here.

sources:
  - id: learn-fabric
    kind: html
    base: https://learn.microsoft.com/fabric
    priority: 1
    notes: Primary product docs. Highest trust.

  - id: learn-rest-fabric
    kind: html
    base: https://learn.microsoft.com/rest/api/fabric
    priority: 1
    notes: REST API reference.

  - id: roadmap-fabric
    kind: json
    base: https://roadmap.fabric.microsoft.com
    priority: 2
    notes: Public roadmap. Used to gate preview/coming-soon features.

  - id: whats-new-fabric
    kind: html
    base: https://learn.microsoft.com/fabric/fundamentals/whats-new
    priority: 2
    notes: Rolling monthly changes. Cross-check for renames.

  - id: known-issues-fabric
    kind: html
    base: https://support.fabric.microsoft.com/known-issues/
    priority: 3
    notes: >-
      Active bugs. Add workaround notes when a lab step hits one.
      NOTE: this list moved off Microsoft Learn. The former
      https://learn.microsoft.com/fabric/fundamentals/known-issues returns 404.

  - id: learn-purview
    kind: html
    base: https://learn.microsoft.com/purview
    priority: 1
    notes: >-
      Purview product docs. Required for catalogue, data map, sensitivity label and
      audit-retention claims, which live outside the /fabric doc tree. Purview surfaces
      are renamed frequently - always confirm the current product name.

  - id: fabric-blog
    kind: html
    base: https://blog.fabric.microsoft.com
    priority: 4
    notes: Announcements. Lower trust than Learn — use only for context, not as sole citation.
