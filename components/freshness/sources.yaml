# Microsoft Fabric documentation sources used by the freshness verifier.
# Source registry for manual/tool-assisted review; no resolver API is implemented.

sources:
  - id: learn-fabric
    kind: html
    base: https://learn.microsoft.com/fabric
    priority: 1
    notes: Primary product docs. Highest trust.

  - id: learn-rest-fabric
    kind: html
    base: https://learn.microsoft.com/rest/api/fabric
    priority: 1
    notes: REST API reference.

  - id: roadmap-fabric
    kind: html
    base: https://roadmap.fabric.microsoft.com
    priority: 2
    notes: Public roadmap context; not proof of tenant availability or a documented JSON feed.

  - id: whats-new-fabric
    kind: html
    base: https://learn.microsoft.com/fabric/fundamentals/whats-new
    priority: 2
    notes: Rolling monthly changes. Cross-check for renames.

  - id: known-issues-fabric
    kind: html
    base: https://learn.microsoft.com/fabric/fundamentals/known-issues
    priority: 3
    notes: Active bugs. Add workaround notes when a lab step hits one.

  - id: fabric-blog
    kind: html
    base: https://blog.fabric.microsoft.com
    priority: 4
    notes: Dated Microsoft examples and design context. Verify relevant posts; cross-check procedures and availability against Learn, never use as the sole operational citation.
