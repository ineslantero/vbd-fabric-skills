# workshop.yaml — the handoff contract between all /vbd-* skills.
# /vbd-plan writes it. CSA reviews/edits. Downstream skills read it.
#
# Fields marked (*) are required.

workshop:
  id: <slug>                              # * e.g. contoso-fabric-jan2027
  customer:
    name: <string>                        # *
    industry: <slug>                      # * healthcare-payer | banking-retail | manufacturing-discrete | ...
    persona_mix: []                       # data-engineer | bi-analyst | data-architect | data-scientist | platform-admin
    audience_size: 0
    sensitivity: <label>                  # public | internal | confidential | highly-confidential
  scoping:
    source: <paste|workiq|email-thread>   # * where /vbd-plan got the transcript
    meeting_id: <string>                  # if source=workiq
    transcript_path: <path>               # relative to repo, always kept for audit
    date: <YYYY-MM-DD>
  objectives: []                          # * bullet list from transcript
  constraints:
    duration_days: 0                      # *
    delivery_mode: <onsite|remote|hybrid>
    fabric_capacity_sku: <F2|F4|...|F64>
    existing_stack: []                    # Synapse | ADF | PBI Premium | Databricks | ...
    regions: []                           # tenant regions attendees will use
  modules:                                # * ordered; each maps to a /vbd-lab-* skill call
    - id: <module-id>                     # foundation | lakehouse | datafactory | warehouse | rti | datascience | security | powerbi
      include: true
      duration_hours: 0
      include_topics: []
      exclude_topics: []
      customer_angle: <one-liner>
      teaching:                            # * course explanation -> worked example -> practice -> debrief
        concept: <concept-and-business-decision>
        worked_example: <starting-artifact-persona-and-lab-step-range>
        learner_task: <concrete-change-the-learner-makes>
        evidence: <expected-output-and-how-to-check-it>
        debrief: <trade-off-or-transfer-question>
      learning:                            # * required for included modules in newly authored courses
        mode: <hands-on|guided-hands-on|demonstration|offline-design>
        lab_path: <labs/nn-module/README.md>
        explain_minutes: 0
        setup_minutes: 0
        guided_minutes: 0
        practice_minutes: 0
        check_minutes: 0
        cleanup_minutes: 0                  # sum all six fields = duration_hours * 60
        starting_state: <items-tables-and-earlier-lab-dependencies>
        standalone_setup: <exact-step-link-or-complete-bootstrap-procedure>
        required_roles: []
        feature_prerequisites: []           # capacity/licence/region/tenant setting, each with source
        setup_owner: <role-not-private-personal-details>
        readiness_check: <action-and-expected-result>
        output_artifact: <item-or-file-the-learner-creates>
        success_criteria: []                # observable checks, including expected query results
        challenge: <independent-change-and-acceptance-criteria>
        fallback: <observed-or-offline-route-not-labelled-executed>
        cleanup: []                         # owned resources only; reverse changes safely
        execution_status: not-run           # not-run | passed | failed | blocked; attach evidence if run
        sources:
          - url: <verified-microsoft-learn-procedure-url>
            role: procedure                # procedure | context | availability
            checked_on: <YYYY-MM-DD>
            supports: <step-range-or-claim>
      # if include=false:
      # reason: <why skipped>
  data_strategy:
    mode: <synthetic|anonymised-customer|public-remapped>
    domain: <slug>                        # healthcare-claims | banking-txn | mfg-telemetry | ...
    volume: {}                            # arbitrary key -> row count map
    schema_seed: <slug>                   # reproducibility handle
  prerequisites:
    capacity: <F-SKU>
    licences: []                          # e.g. "PBI Pro x12"
    tenant_settings: []
    attendee_setup: []
    data_upload: <string>
  deliverable:
    repo_name: <slug>
    repo_host: <github-private|ado|zip>
    include_solutions: false
    language: en
  freshness:
    fabric_release_pinned: <YYYY-MM>      # * documentation release reference, not runtime version lock
    allow_preview_features: true
    allow_roadmap_futures: true
    regions_to_check: []
    strictness: <strict|balanced|permissive>
    last_verified: <ISO-8601>
